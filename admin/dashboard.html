<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dashboard — N.D. Flow Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/assets/logo-mark.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="/admin/admin.css" />
</head>
<body class="admin-body">

<div class="auth-loading"><span class="spinner"></span> Loading…</div>

<div class="admin-shell">
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-sidebar-brand">
      <img src="/assets/logo-mark.png" alt="" />
      <span>N.D. Flow<span class="dot">.</span><small>ADMIN</small></span>
    </div>
    <nav class="admin-nav">
      <a href="/admin/dashboard.html" class="admin-nav-link active"><i data-lucide="layout-dashboard" class="icon-sm"></i> Overview</a>
      <a href="/admin/gallery.html" class="admin-nav-link"><i data-lucide="image" class="icon-sm"></i> Gallery</a>
      <span class="admin-nav-link disabled"><i data-lucide="wrench" class="icon-sm"></i> Services <em>Soon</em></span>
      <span class="admin-nav-link disabled"><i data-lucide="star" class="icon-sm"></i> Testimonials <em>Soon</em></span>
      <span class="admin-nav-link disabled"><i data-lucide="newspaper" class="icon-sm"></i> Blog <em>Soon</em></span>
      <span class="admin-nav-link disabled"><i data-lucide="mail" class="icon-sm"></i> Messages <em>Soon</em></span>
    </nav>
    <div class="admin-sidebar-footer">
      <a href="/" class="admin-nav-link" target="_blank" rel="noopener"><i data-lucide="external-link" class="icon-sm"></i> View live site</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <button id="sidebar-toggle" class="icon-btn" aria-label="Open menu"><i data-lucide="menu" class="icon"></i></button>
      <h1>Overview</h1>
      <div class="admin-topbar-right">
        <span id="admin-email" class="admin-user-email"></span>
        <button id="logout-btn" class="btn-ghost-dark"><i data-lucide="log-out" class="icon-sm"></i> Log out</button>
      </div>
    </header>

    <main class="admin-content">
      <section class="stats-grid" id="stats-grid"></section>

      <section class="admin-panel">
        <h2>Quick actions</h2>
        <a href="/admin/gallery.html" class="admin-quick-action">
          <span>Manage gallery photos</span>
          <i data-lucide="arrow-right" class="icon-sm"></i>
        </a>
      </section>
    </main>
  </div>
</div>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="module" src="/admin/js/dashboard.js"></script>
</body>
</html>
