<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin Sign In — N.D. Flow Plumbing Co.</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/assets/logo-mark.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="/admin/admin.css" />
</head>
<body class="admin-auth-body">

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="/assets/logo-mark.png" alt="" />
      <span>N.D. Flow<span class="dot">.</span><small>ADMIN</small></span>
    </div>
    <h1>Sign in</h1>
    <p class="auth-sub">Manage your website content.</p>

    <form id="login-form" novalidate>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="username" required />
      </label>
      <label class="field">
        <span>Password</span>
        <div class="password-field">
          <input type="password" name="password" id="password-input" autocomplete="current-password" required />
          <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password">
            <i data-lucide="eye" class="icon-sm"></i>
          </button>
        </div>
      </label>
      <div id="login-message" class="form-message" role="alert" hidden></div>
      <button type="submit" class="btn-accent btn-block" id="login-submit">
        <span class="btn-label">Sign in</span>
      </button>
      <button type="button" id="forgot-btn" class="link-btn">Forgot password?</button>
    </form>
  </div>
</main>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="module" src="/admin/js/login.js"></script>
</body>
</html>
